[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "w4h-sample-icde-demo-csv-importer"
version = "0.1.0"
description = "Import ICDE demo CSV sample data into W4H via API key"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.28",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.scripts]
w4h-sample-icde-demo-csv-import = "w4h_sample_icde_demo_csv_importer.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["w4h_sample_icde_demo_csv_importer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
